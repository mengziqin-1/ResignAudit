<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>离职安全审计报告</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: #f5f7fa; color: #333; }
        
        .report-container { max-width: 1400px; margin: 0 auto; background: #fff; min-height: 100vh; }
        
        .report-header { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: #fff; padding: 30px 40px; }
        .report-header h1 { font-size: 28px; margin-bottom: 10px; font-weight: 600; }
        .report-header .subtitle { opacity: 0.9; font-size: 14px; }
        
        .report-nav { background: #f8f9fa; border-bottom: 1px solid #e9ecef; padding: 0 40px; }
        .report-nav ul { list-style: none; display: flex; }
        .report-nav li { padding: 15px 20px; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; font-size: 14px; font-weight: 500; }
        .report-nav li:hover { background: #e9ecef; }
        .report-nav li.active { border-bottom-color: #2a5298; color: #2a5298; }
        
        .report-content { padding: 30px 40px; }
        
        .section { display: none; }
        .section.active { display: block; }
        
        .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 24px; margin-bottom: 24px; }
        .card-header { border-bottom: 1px solid #f0f0f0; padding-bottom: 16px; margin-bottom: 20px; }
        .card-title { font-size: 18px; font-weight: 600; color: #2a5298; }
        
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .info-item { padding: 16px; background: #f8f9fa; border-radius: 8px; }
        .info-label { font-size: 12px; color: #666; margin-bottom: 4px; }
        .info-value { font-size: 16px; font-weight: 600; color: #333; }
        
        .risk-score-display { text-align: center; padding: 30px; }
        .risk-score { font-size: 72px; font-weight: 700; margin-bottom: 10px; }
        .risk-level { font-size: 24px; font-weight: 600; }
        .risk-high { color: #dc3545; }
        .risk-medium { color: #fd7e14; }
        .risk-low { color: #ffc107; }
        .risk-none { color: #28a745; }
        
        .findings-list { margin-top: 16px; }
        .finding-item { padding: 12px 16px; border-left: 4px solid #2a5298; background: #f8f9fa; margin-bottom: 12px; border-radius: 0 4px 4px 0; }
        .finding-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .finding-name { font-weight: 600; }
        .finding-score { font-size: 14px; padding: 2px 8px; border-radius: 4px; background: #e9ecef; }
        
        .table-container { overflow-x: auto; margin-top: 16px; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .data-table th { background: #f8f9fa; padding: 12px 16px; text-align: left; font-weight: 600; border-bottom: 2px solid #e9ecef; }
        .data-table td { padding: 10px 16px; border-bottom: 1px solid #f0f0f0; vertical-align: top; word-break: break-all; line-height: 1.5; }
        .data-table tr:hover { background: #f8f9fa; }
        .data-table .col-index { width: 60px; text-align: center; }
        .data-table .col-type { width: 100px; }
        .data-table .col-path { width: 40%; min-width: 200px; }
        .data-table .col-size { width: 80px; }
        .data-table .col-time { width: 180px; }
        .data-table .col-file-name { width: 40%; min-width: 200px; }
        .data-table .col-desc { width: auto; }
        
        .timeline-controls { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .control-group { display: flex; align-items: center; gap: 8px; }
        .control-group label { font-size: 14px; font-weight: 500; }
        .control-group select, .control-group input { padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        .control-group input { width: 200px; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s; }
        .btn-primary { background: #2a5298; color: #fff; }
        .btn-primary:hover { background: #1e3c72; }
        .btn-secondary { background: #e9ecef; color: #333; }
        .btn-secondary:hover { background: #dee2e6; }
        
        .timeline-stats { display: flex; gap: 20px; margin-bottom: 16px; flex-wrap: wrap; }
        .stat-item { padding: 10px 16px; background: #f8f9fa; border-radius: 4px; font-size: 14px; }
        .stat-value { font-weight: 600; color: #2a5298; }
        
        .timeline-container { max-height: 500px; overflow-y: auto; border: 1px solid #e9ecef; border-radius: 8px; background: #fff; }
        .timeline-row { padding: 10px 16px; border-bottom: 1px solid #f0f0f0; display: flex; gap: 16px; align-items: flex-start; }
        .timeline-row:hover { background: #f8f9fa; }
        .timeline-row.odd { background: #fafafa; }
        .timeline-row.marked { background: #fff3cd; }
        .timeline-col { flex-shrink: 0; }
        .timeline-col.index { width: 50px; font-size: 12px; color: #999; text-align: center; padding-top: 2px; }
        .timeline-col.time { width: 170px; font-size: 13px; color: #666; font-family: monospace; padding-top: 2px; }
        .timeline-col.type { width: 80px; font-size: 12px; padding: 2px 8px; border-radius: 4px; text-align: center; }
        .timeline-col.type-file { background: #e3f2fd; color: #1976d2; }
        .timeline-col.type-content { background: #fce4ec; color: #c2185b; }
        .timeline-col.type-usb { background: #e8f5e9; color: #2e7d32; }
        .timeline-col.type-browser { background: #fff3e0; color: #e65100; }
        .timeline-col.type-chat { background: #f3e5f5; color: #7b1fa2; }
        .timeline-col.description { flex: 1; font-size: 13px; word-break: break-all; line-height: 1.5; }
        
        .type-filter { display: flex; gap: 8px; flex-wrap: wrap; }
        .type-tag { padding: 4px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; border: 1px solid #ddd; transition: all 0.2s; }
        .type-tag.active { background: #2a5298; color: #fff; border-color: #2a5298; }
        
        .findings-stats { display: flex; gap: 20px; margin-bottom: 16px; flex-wrap: wrap; }
        .findings-tab { padding: 10px 16px; background: #f8f9fa; border-radius: 4px; font-size: 14px; cursor: pointer; border: 1px solid #ddd; transition: all 0.2s; }
        .findings-tab:hover { background: #e9ecef; }
        .findings-tab.active { background: #2a5298; color: #fff; border-color: #2a5298; }
        .findings-tab-count { font-weight: 600; margin-left: 4px; }
        
        .findings-table-container { max-height: 400px; overflow-y: auto; border: 1px solid #e9ecef; border-radius: 8px; margin-top: 12px; }
        
        .footer { text-align: center; padding: 20px; color: #999; font-size: 12px; border-top: 1px solid #e9ecef; }
        
        @media (max-width: 768px) {
            .report-header { padding: 20px; }
            .report-header h1 { font-size: 20px; }
            .report-content { padding: 16px; }
            .info-grid { grid-template-columns: 1fr; }
            .timeline-controls { flex-direction: column; }
            .control-group { flex-direction: column; align-items: flex-start; }
            .control-group input { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="report-container">
        <div class="report-header">
            <h1>离职场景电子数据取证分析报告</h1>
            <div class="subtitle" id="report-subtitle">Generated by Security Audit System</div>
        </div>
        
        <div class="report-nav">
            <ul>
                <li class="active" onclick="showSection('summary')">报告概览</li>
                <li onclick="showSection('findings')">审计发现</li>
                <li onclick="showSection('timeline')">事件时间线</li>
                <li onclick="showSection('evidence')">证据清单</li>
            </ul>
        </div>
        
        <div class="report-content">
            <div id="summary" class="section active">
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">基本信息</div>
                    </div>
                    <div class="info-grid" id="info-grid"></div>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">风险评估结果</div>
                    </div>
                    <div class="risk-score-display">
                        <div class="risk-score" id="risk-score">0</div>
                        <div class="risk-level" id="risk-level">无风险</div>
                    </div>
                    <div class="findings-list" id="findings-summary"></div>
                </div>
            </div>
            
            <div id="findings" class="section">
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">详细审计发现</div>
                    </div>
                    
                    <div class="findings-stats" id="findings-stats"></div>
                    
                    <div class="findings-table-container" id="findings-table-container"></div>
                    
                    <div style="margin-top: 12px; text-align: center; font-size: 13px; color: #666;">
                        <span id="findings-count-info">共 0 条</span>
                    </div>
                </div>
            </div>
            
            <div id="timeline" class="section">
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">事件时间线</div>
                    </div>
                    
                    <div class="timeline-stats">
                        <div class="stat-item">总事件数: <span class="stat-value" id="total-events">0</span></div>
                        <div class="stat-item">文件操作: <span class="stat-value" id="file-events">0</span></div>
                        <div class="stat-item">内容发现: <span class="stat-value" id="content-events">0</span></div>
                        <div class="stat-item">USB操作: <span class="stat-value" id="usb-events">0</span></div>
                        <div class="stat-item">浏览器访问: <span class="stat-value" id="browser-events">0</span></div>
                        <div class="stat-item">聊天记录: <span class="stat-value" id="chat-events">0</span></div>
                    </div>
                    
                    <div class="timeline-controls">
                        <div class="control-group">
                            <label>类型筛选:</label>
                            <div class="type-filter" id="type-filter"></div>
                        </div>
                        <div class="control-group">
                            <label>搜索:</label>
                            <input type="text" id="timeline-search" placeholder="搜索事件描述..." oninput="handleSearch()">
                        </div>
                        <div class="control-group">
                            <button class="btn btn-secondary" onclick="resetFilters()">重置筛选</button>
                        </div>
                    </div>
                    
                    <div class="timeline-container" id="timeline-container">
                        <div id="timeline-content"></div>
                    </div>
                    
                    <div style="margin-top: 12px; text-align: center; font-size: 13px; color: #666;">
                        <span id="scroll-info">共 0 条</span>
                    </div>
                </div>
            </div>
            
            <div id="evidence" class="section">
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">证据清单</div>
                    </div>
                    <div class="table-container">
                        <table class="data-table" id="evidence-table">
                            <thead>
                                <tr><th class="col-index">序号</th><th class="col-type">类型</th><th class="col-path">路径</th><th class="col-size">大小</th><th class="col-time">修改时间</th></tr>
                            </thead>
                            <tbody id="evidence-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            报告生成时间: <span id="generated-time"></span> | 面向离职风险的电子数据取证辅助系统
        </div>
    </div>

    <script>
        var REPORT_DATA = null;
        var timelineData = [];
        var filteredTimeline = [];
        var findingsData = [];
        var currentFindingsType = 'all';
        
        var typeColors = {
            'file': 'type-file',
            'content': 'type-content',
            'usb': 'type-usb',
            'browser': 'type-browser',
            'chat': 'type-chat'
        };
        
        var typeLabels = {
            'file': '文件',
            'content': '内容',
            'usb': 'USB',
            'browser': '浏览器',
            'chat': '聊天'
        };
        
        var findingTypeLabels = {
            'all': '全部',
            'sensitive_keyword': '敏感关键词',
            'cloud_storage': '云存储相关',
            'email': '邮箱相关',
            'email_address': '邮箱地址',
            'phone_number': '手机号码',
            'ip_address': 'IP地址'
        };
        
        function init(data) {
            REPORT_DATA = data;
            timelineData = data.timeline || [];
            findingsData = data.content_findings || [];
            filteredTimeline = [...timelineData];
            
            renderSummary();
            renderFindings();
            renderEvidence();
            initTimeline();
            
            document.getElementById('generated-time').textContent = new Date().toLocaleString('zh-CN');
            document.getElementById('report-subtitle').textContent = `员工: ${data.employee_name || '未指定'} | ${data.audit_time_range || ''}`;
        }
        
        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.report-nav li').forEach(el => el.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            event.target.classList.add('active');
        }
        
        function renderSummary() {
            var data = REPORT_DATA;
            var grid = document.getElementById('info-grid');
            
            var infoItems = [
                { label: '审计项目', value: '面向离职风险的电子数据取证辅助系统' },
                { label: '审计日期', value: new Date().toLocaleString('zh-CN') },
                { label: '员工姓名', value: data.employee_name || '未指定' },
                { label: '审计范围', value: data.audit_range || '未指定' },
                { label: '审计时间', value: data.audit_time_range || '未指定' },
                { label: '风险等级', value: (data.risk_level || {}).level || '未评估' }
            ];
            
            Object.entries(data.data_sources || {}).forEach(([key, value]) => {
                infoItems.push({ label: key, value: String(value) });
            });
            
            grid.innerHTML = infoItems.map(item => `
                <div class="info-item">
                    <div class="info-label">${item.label}</div>
                    <div class="info-value">${escapeHtml(item.value)}</div>
                </div>
            `).join('');
            
            var risk = data.risk_level || {};
            var score = risk.score || 0;
            var level = risk.level || '无风险';
            var levelClass = 'risk-none';
            
            if (score >= 60) levelClass = 'risk-high';
            else if (score >= 30) levelClass = 'risk-medium';
            else if (score > 0) levelClass = 'risk-low';
            
            document.getElementById('risk-score').textContent = score;
            document.getElementById('risk-score').className = 'risk-score ' + levelClass;
            document.getElementById('risk-level').textContent = level;
            document.getElementById('risk-level').className = 'risk-level ' + levelClass;
            
            var findings = data.findings || [];
            var summaryHtml = findings.map((f, i) => {
                var color = getSeverityColor(f.severity);
                return `
                    <div class="finding-item">
                        <div class="finding-header">
                            <span class="finding-name">${i+1}. ${escapeHtml(f.rule_name || '')}</span>
                            <span class="finding-score">评分: ${f.score || 0}分</span>
                        </div>
                        <div style="font-size: 13px; color: #666;">${escapeHtml(f.description || '')}</div>
                    </div>
                `;
            }).join('');
            
            document.getElementById('findings-summary').innerHTML = summaryHtml || '<div style="text-align: center; color: #999;">暂无风险发现</div>';
        }
        
        function renderFindings() {
        var statsContainer = document.getElementById('findings-stats');
        var tableContainer = document.getElementById('findings-table-container');
        var countInfo = document.getElementById('findings-count-info');
        
        var typeCounts = {};
        Object.keys(findingTypeLabels).forEach(type => {
            typeCounts[type] = type === 'all' ? findingsData.length : findingsData.filter(f => f.type === type).length;
        });
        
        var statsHtml = '';
        Object.entries(findingTypeLabels).forEach(([type, label]) => {
            var isActive = type === currentFindingsType;
            var count = typeCounts[type] || 0;
            if (type !== 'all' && count === 0) return;
            
            statsHtml += `
                <div class="findings-tab ${isActive ? 'active' : ''}" onclick="switchFindingsType('${type}')">
                    ${label}<span class="findings-tab-count">(${count})</span>
                </div>
            `;
        });
        statsContainer.innerHTML = statsHtml;
        
        var displayedFindings = currentFindingsType === 'all' ? findingsData : findingsData.filter(f => f.type === currentFindingsType);
        
        var tableHtml = `
            <table class="data-table">
                <thead>
                    <tr><th class="col-index">序号</th><th class="col-file-name">文件路径</th><th class="col-time">修改时间</th><th class="col-desc">发现内容</th></tr>
                </thead>
                <tbody>
        `;
        
        if (displayedFindings.length === 0) {
            tableHtml += `
                <tr><td colspan="4" style="text-align: center; color: #999; padding: 40px;">暂无该类型审计发现</td></tr>
            `;
        } else {
            displayedFindings.forEach((f, i) => {
                var displayName = '';
                // 判断是本地文件还是URL
                if (f.file_path && (f.file_path.startsWith('http://') || f.file_path.startsWith('https://'))) {
                    // 是URL，优先显示file_name(title)
                    displayName = f.file_name || f.file_path;
                } else {
                    // 是本地文件，显示file_path(绝对路径)
                    displayName = f.file_path || f.file_name;
                }
                tableHtml += `
                    <tr>
                        <td class="col-index">${i+1}</td>
                        <td class="col-file-name">${escapeHtml(displayName || '')}</td>
                        <td class="col-time">${formatTime(f.modify_time)}</td>
                        <td class="col-desc">${escapeHtml(f.description || '')}</td>
                    </tr>
                `;
            });
        }
            
            tableHtml += '</tbody></table>';
            tableContainer.innerHTML = tableHtml;
            
            countInfo.textContent = `共 ${displayedFindings.length} 条`;
        }
        
        function switchFindingsType(type) {
            currentFindingsType = type;
            renderFindings();
        }
        
        function renderEvidence() {
            var data = REPORT_DATA;
            var tbody = document.getElementById('evidence-body');
            
            var allEvidence = [];
            var fileScan = data.file_scan_results || [];
            var contentFindings = data.content_findings || [];
            
            fileScan.forEach(file => {
                allEvidence.push({
                    type: '文件',
                    path: file.file_path || '',
                    size: file.file_size_human || '',
                    modify_time: file.modify_time
                });
            });
            
            contentFindings.forEach(finding => {
                var displayPath = '';
                // 判断是本地文件还是URL
                if (finding.file_path && (finding.file_path.startsWith('http://') || finding.file_path.startsWith('https://'))) {
                    // 是URL，优先显示file_name(title)
                    displayPath = finding.file_name || finding.file_path;
                } else {
                    // 是本地文件，显示file_path(绝对路径)
                    displayPath = finding.file_path || finding.file_name;
                }
                allEvidence.push({
                    type: '内容发现(' + (finding.type || '') + ')',
                    path: displayPath,
                    size: '',
                    modify_time: finding.modify_time
                });
            });
            
            var html = '';
            allEvidence.forEach((evidence, i) => {
                html += `<tr>
                    <td class="col-index">${i+1}</td>
                    <td class="col-type">${escapeHtml(evidence.type)}</td>
                    <td class="col-path">${escapeHtml(evidence.path)}</td>
                    <td class="col-size">${escapeHtml(evidence.size)}</td>
                    <td class="col-time">${formatTime(evidence.modify_time)}</td>
                </tr>`;
            });
            
            tbody.innerHTML = html || '<tr><td colspan="5" style="text-align: center; color: #999;">暂无证据记录</td></tr>';
        }
        
        function initTimeline() {
            var filterContainer = document.getElementById('type-filter');
            var filters = [
                { value: 'all', label: '全部' },
                { value: 'file', label: '文件' },
                { value: 'content', label: '内容' },
                { value: 'usb', label: 'USB' },
                { value: 'browser', label: '浏览器' },
                { value: 'chat', label: '聊天' }
            ];
            
            filterContainer.innerHTML = filters.map(f => 
                `<span class="type-tag ${f.value === 'all' ? 'active' : ''}" 
                       onclick="filterByType('${f.value}')">${f.label}</span>`
            ).join('');
            
            updateStats();
            renderTimeline();
        }
        
        function filterByType(type) {
            document.querySelectorAll('.type-tag').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            
            if (type === 'all') {
                filteredTimeline = [...timelineData];
            } else {
                filteredTimeline = timelineData.filter(e => e.event_type === type);
            }
            
            updateStats();
            renderTimeline();
        }
        
        function handleSearch() {
            var query = document.getElementById('timeline-search').value.toLowerCase().trim();
            
            if (!query) {
                var activeType = document.querySelector('.type-tag.active').getAttribute('onclick').match(/'([^']+)'/)[1];
                filterByType(activeType);
                return;
            }
            
            filteredTimeline = timelineData.filter(e => {
                var desc = e.file_name || e.description || e.device_name || e.title || e.url || '';
                var sender = e.sender || '';
                var receiver = e.receiver || '';
                return String(desc).toLowerCase().includes(query) ||
                       String(sender).toLowerCase().includes(query) ||
                       String(receiver).toLowerCase().includes(query);
            });
            
            updateStats();
            renderTimeline();
        }
        
        function resetFilters() {
            document.getElementById('timeline-search').value = '';
            filterByType('all');
        }
        
        function updateStats() {
            var stats = { total: filteredTimeline.length, file: 0, content: 0, usb: 0, browser: 0, chat: 0 };
            
            filteredTimeline.forEach(e => {
                var type = e.event_type || '';
                if (stats[type] !== undefined) stats[type]++;
            });
            
            document.getElementById('total-events').textContent = stats.total;
            document.getElementById('file-events').textContent = stats.file;
            document.getElementById('content-events').textContent = stats.content;
            document.getElementById('usb-events').textContent = stats.usb;
            document.getElementById('browser-events').textContent = stats.browser;
            document.getElementById('chat-events').textContent = stats.chat;
        }
        
        function renderTimeline() {
            var container = document.getElementById('timeline-content');
            var html = '';
            
            filteredTimeline.forEach((event, i) => {
                var type = event.event_type || '';
                var typeClass = typeColors[type] || 'type-file';
                var typeLabel = typeLabels[type] || type;
                var desc = '';
                
                if (type === 'file') desc = event.file_path || event.file_name || '';
                else if (type === 'content') desc = event.description || '';
                else if (type === 'usb') desc = event.device_name || 'USB设备操作';
                else if (type === 'browser') {
                    var title = event.title || '';
                    var url = event.url || '';
                    desc = title ? title + ' - ' + url : url;
                } else if (type === 'chat') {
                    desc = (event.sender || '') + ' -> ' + (event.receiver || '') + ': ' + (event.content || '').substring(0, 80);
                } else {
                    desc = event.description || '';
                }
                
                var isMarked = type === 'content' || type === 'usb';
                var rowClass = (i % 2 === 0 ? '' : 'odd ') + (isMarked ? 'marked' : '');
                
                html += `<div class="timeline-row ${rowClass}">
                    <div class="timeline-col index">${i + 1}</div>
                    <div class="timeline-col time">${formatTime(event.timestamp)}</div>
                    <div class="timeline-col type ${typeClass}">${typeLabel}</div>
                    <div class="timeline-col description" title="${escapeHtml(desc)}">${escapeHtml(desc)}</div>
                </div>`;
            });
            
            container.innerHTML = html || '<div style="padding: 40px; text-align: center; color: #999;">暂无事件记录</div>';
            document.getElementById('scroll-info').textContent = `共 ${filteredTimeline.length} 条`;
        }
        
        function formatTime(timestamp) {
            if (!timestamp) return '';
            if (typeof timestamp === 'string') {
                if (timestamp.includes('T')) timestamp = timestamp.replace('T', ' ');
                return timestamp.substring(0, 19);
            }
            return timestamp;
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
        
        function getSeverityColor(severity) {
            var colors = {
                'critical': '#dc3545',
                'high': '#dc3545',
                'medium': '#fd7e14',
                'low': '#ffc107'
            };
            return colors[severity] || '#666';
        }
    </script>
    
    <script>
        var REPORT_DATA_JSON = {{REPORT_DATA_JSON}};
        init(REPORT_DATA_JSON);
    </script>
</body>
</html>
